# Copy to configs/models.local.yaml and replace model names only after checking
# that each exact model/version is available. Never commit API keys.
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      - REPLACE_WITH_EXACT_MODEL_ID
temperature: 0
max_tokens: 500
timeout_seconds: 90

