name: Run model evaluation batch

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Exact OpenRouter model ID (prefer a specific :free model)"
        required: true
        default: "liquid/lfm-2.5-2.6b:free"
        type: string
      protocol:
        description: "Evaluation protocol"
        required: true
        default: "three_way"
        type: choice
        options:
          - binary
          - three_way
          - uncertainty_instruction
          - evidence_gated
      case_offset:
        description: "Zero-based starting case index for this immutable shard"
        required: true
        default: "0"
        type: string
      case_limit:
        description: "Number of cases in this shard (free accounts have low daily limits)"
        required: true
        default: "20"
        type: string
  push:
    branches:
      - smoke-eval

permissions:
  contents: read

concurrency:
  group: model-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.KEY }}
      PYTHONUNBUFFERED: "1"
      RUN_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'smoke' }}
      MODEL_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.model_id || 'liquid/lfm-2.5-2.6b:free' }}
      PROTOCOL: ${{ github.event_name == 'workflow_dispatch' && inputs.protocol || 'evidence_gated' }}
      CASE_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.case_offset || '0' }}
      CASE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.case_limit || '2' }}
      CASES_FILE: data/processed/benchmark.jsonl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret KEY is missing."
            exit 1
          fi

      - name: Record non-sensitive OpenRouter key diagnostics
        shell: bash
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import httpx

          response = httpx.get(
              "https://openrouter.ai/api/v1/key",
              headers={"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"},
              timeout=30,
          )
          payload = {"http_status": response.status_code}
          if response.status_code == 200:
              data = response.json().get("data", {})
              for field in (
                  "is_free_tier",
                  "limit",
                  "limit_remaining",
                  "limit_reset",
                  "usage",
                  "usage_daily",
                  "usage_weekly",
                  "usage_monthly",
                  "expires_at",
              ):
                  payload[field] = data.get(field)
          else:
              payload["error"] = response.text[:500]
          Path("results/KEY_DIAGNOSTICS.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
          )
          if response.status_code == 401:
              raise SystemExit("OpenRouter rejected the repository secret KEY (HTTP 401).")
          PY

      - name: Download and verify official datasets
        run: |
          python scripts/download_data.py
          python scripts/validate_data.py

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Build paired real-record benchmarks
        run: make build

      - name: Select a paired uncertainty case for smoke runs
        if: env.RUN_KIND == 'smoke'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from unknown_ineligible.schema import BenchmarkCase

          source = Path("data/processed/benchmark.jsonl")
          cases = [
              BenchmarkCase.model_validate_json(line)
              for line in source.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          by_pair = {}
          for case in cases:
              if case.expected.decision != "INSUFFICIENT_INFORMATION":
                  continue
              if case.condition not in {"omitted", "explicit_unknown"}:
                  continue
              key = (case.base_case_id, case.masked_field)
              by_pair.setdefault(key, {})[case.condition] = case

          selected = None
          for key in sorted(by_pair):
              pair = by_pair[key]
              if "omitted" in pair and "explicit_unknown" in pair:
                  selected = [pair["omitted"], pair["explicit_unknown"]]
                  break

          if selected is None:
              raise SystemExit("No paired omitted/explicit_unknown uncertainty case found.")

          output = Path("data/processed/smoke_benchmark.jsonl")
          output.write_text(
              "".join(case.model_dump_json() + "\n" for case in selected),
              encoding="utf-8",
          )
          print(
              "Selected smoke pair:",
              [(c.case_id, c.condition, c.masked_field, c.expected.decision) for c in selected],
          )
          PY
          echo "CASES_FILE=data/processed/smoke_benchmark.jsonl" >> "$GITHUB_ENV"
          echo "CASE_OFFSET=0" >> "$GITHUB_ENV"
          echo "CASE_LIMIT=2" >> "$GITHUB_ENV"

      - name: Create private runtime model configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config = {
              "providers": {
                  "openrouter": {
                      "base_url": "https://openrouter.ai/api/v1",
                      "api_key_env": "OPENROUTER_API_KEY",
                      "models": [os.environ["MODEL_ID"]],
                  }
              },
              "temperature": 0,
              "max_tokens": 500,
              "timeout_seconds": 90,
              "max_attempts": 4,
              "structured_output": True,
              "reasoning": {"effort": "minimal", "exclude": True},
          }
          Path("configs/models.local.yaml").write_text(
              yaml.safe_dump(config, sort_keys=False), encoding="utf-8"
          )
          PY

      - name: Validate shard inputs
        shell: bash
        run: |
          if ! [[ "$CASE_OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error::case_offset must be a non-negative integer."
            exit 1
          fi
          if ! [[ "$CASE_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::case_limit must be a positive integer."
            exit 1
          fi
          if [ "$CASE_LIMIT" -gt 200 ]; then
            echo "::error::A single free-tier shard is capped at 200 cases."
            exit 1
          fi
          if [ "$RUN_KIND" = "smoke" ] && [ "$CASE_LIMIT" -ne 2 ]; then
            echo "::error::Push-triggered smoke runs are hard-capped at exactly 2 cases."
            exit 1
          fi

      - name: Run model shard
        run: |
          python -m unknown_ineligible.run_models \
            --models configs/models.local.yaml \
            --cases "$CASES_FILE" \
            --protocol "$PROTOCOL" \
            --offset "$CASE_OFFSET" \
            --limit "$CASE_LIMIT" \
            --output results/raw/responses.jsonl

      - name: Score responses with preregistered provider-failure handling
        run: |
          python -m unknown_ineligible.score \
            --inputs results/raw/responses.jsonl \
            --case-file "$CASES_FILE" \
            --output results/tables/metrics.csv \
            --case-output results/tables/scored_cases.csv

      - name: Record reproducibility metadata
        shell: bash
        run: |
          {
            echo "run_kind=${RUN_KIND}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "model_id=${MODEL_ID}"
            echo "protocol=${PROTOCOL}"
            echo "cases_file=${CASES_FILE}"
            echo "case_offset=${CASE_OFFSET}"
            echo "case_limit=${CASE_LIMIT}"
            echo "structured_output=true"
            echo "reasoning_effort=minimal"
            echo "reasoning_excluded=true"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            date -u +"executed_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } > results/RUN_METADATA.txt

      - name: Upload immutable result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
          if-no-files-found: error
          retention-days: 90

      - name: Fail run if provider returned no model output
        if: always()
        shell: bash
        run: |
          if [ -f results/raw/responses.jsonl ] && grep -q '"error_type": "api_error"' results/raw/responses.jsonl; then
            echo "::error::Provider/API failure occurred. Artifact was preserved, but this run is not a valid model evaluation."
            exit 1
          fi

      - name: Require two parsed responses for smoke validation
        if: always() && env.RUN_KIND == 'smoke'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("results/raw/responses.jsonl")
          if not path.exists():
              raise SystemExit("Smoke validation produced no response file.")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line]
          if len(rows) != 2:
              raise SystemExit(f"Expected exactly 2 smoke responses, found {len(rows)}.")
          invalid = [row["case_id"] for row in rows if row.get("parsed_answer") is None]
          if invalid:
              raise SystemExit(f"Smoke responses failed schema parsing: {invalid}")
          print("Smoke validation passed: both paired responses parsed against AgentAnswer schema.")
          PY
