name: Run model evaluation batch

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Exact OpenRouter model ID (prefer a specific :free model)"
        required: true
        default: "openrouter/free"
        type: string
      protocol:
        description: "Evaluation protocol"
        required: true
        default: "three_way"
        type: choice
        options:
          - binary
          - three_way
          - uncertainty_instruction
          - evidence_gated
      case_limit:
        description: "Number of cases in this batch (free accounts have low daily limits)"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: model-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret KEY is missing."
            exit 1
          fi

      - name: Download and verify official datasets
        run: |
          python scripts/download_data.py
          python scripts/validate_data.py

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Build paired real-record benchmarks
        run: make build

      - name: Create private runtime model configuration
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config = {
              "providers": {
                  "openrouter": {
                      "base_url": "https://openrouter.ai/api/v1",
                      "api_key_env": "OPENROUTER_API_KEY",
                      "models": [os.environ["MODEL_ID"]],
                  }
              },
              "temperature": 0,
              "max_tokens": 500,
              "timeout_seconds": 90,
          }
          Path("configs/models.local.yaml").write_text(
              yaml.safe_dump(config, sort_keys=False), encoding="utf-8"
          )
          PY

      - name: Validate case limit
        shell: bash
        env:
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          if ! [[ "$CASE_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::case_limit must be a positive integer."
            exit 1
          fi
          if [ "$CASE_LIMIT" -gt 200 ]; then
            echo "::error::A single free-tier batch is capped at 200 cases."
            exit 1
          fi

      - name: Run genuine model batch
        env:
          PROTOCOL: ${{ inputs.protocol }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          python -m unknown_ineligible.run_models \
            --models configs/models.local.yaml \
            --cases data/processed/benchmark.jsonl \
            --protocol "$PROTOCOL" \
            --limit "$CASE_LIMIT" \
            --output results/raw/responses.jsonl

      - name: Score genuine responses
        run: |
          python -m unknown_ineligible.score \
            --inputs results/raw/responses.jsonl \
            --case-file data/processed/benchmark.jsonl \
            --output results/tables/metrics.csv \
            --case-output results/tables/scored_cases.csv

      - name: Record reproducibility metadata
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model_id }}
          PROTOCOL: ${{ inputs.protocol }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "model_id=${MODEL_ID}"
            echo "protocol=${PROTOCOL}"
            echo "case_limit=${CASE_LIMIT}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            date -u +"executed_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } > results/RUN_METADATA.txt

      - name: Upload immutable result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
          if-no-files-found: error
          retention-days: 90
